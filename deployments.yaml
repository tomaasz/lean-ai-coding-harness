# Lean AI Coding Harness deployments

# Each entry tracks a project where this harness has been installed or intentionally maintained.
# `sync_mode` controls `bin/sync-deployments.py` behavior:
#   managed   = safe template files may be copied when unchanged/owned by harness; project files are patched only by markers or reported for manual merge.
#   manual    = listed for visibility; sync reports status but does not write without explicit --include-manual.
# `project_files` are expected to contain project-specific content and must not be force-overwritten by sync.
# `managed_files` are generic harness support files that can be synchronized from templates.

projects:
